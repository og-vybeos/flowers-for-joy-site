# Claude site assistant
# Lets anyone with write access ask Claude to update the site from a GitHub issue
# or comment that mentions @claude. Claude makes the change on a branch and opens a
# pull request; nothing goes live until someone reviews and merges it.
#
# Inactive until an admin (1) installs the Claude GitHub App on this repository
# (https://github.com/apps/claude) and (2) adds a repository secret named
# ANTHROPIC_API_KEY (from https://platform.claude.com). To use a Claude
# subscription instead, create the secret CLAUDE_CODE_OAUTH_TOKEN and swap the
# commented line below. Full steps: README.md, "Using the AI assistant".

name: Claude site assistant

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(ls *),Bash(mkdir *),Bash(mv *),Bash(cp *),Bash(rm uploads/*),Bash(python3 *),Bash(pip install *),Bash(sudo apt-get *),Bash(ffmpeg *),Bash(ffprobe *),Bash(git *)"
